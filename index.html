<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consumibles Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js">
document.addEventListener("DOMContentLoaded",()=>{
  const pf=document.getElementById("product-filter");
  if(pf && typeof PRODS!=="undefined"){
    PRODS.forEach(p=>{
      const op=document.createElement("option");
      op.value=p;
      op.textContent=p;
      pf.appendChild(op);
    });
  }
});

</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#080C18;--bg1:#0F1525;--bg2:#151E32;--bg3:#1C2540;
  --bdr:#232D48;--bdr2:#2E3A58;
  --t1:#E4EDFF;--t2:#7B8DB8;--t3:#3E4D72;
  --blue:#4A8FFF;--teal:#29CCB4;--amber:#F5A623;--purple:#9B7AFA;
  --coral:#F76C8A;--green:#33D48A;--rose:#FF6B9D;
  --font:'Segoe UI',system-ui,sans-serif;
}
body{background:var(--bg0);color:var(--t1);font-family:var(--font);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* TOPBAR */
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;background:var(--bg1);border-bottom:1px solid var(--bdr);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
.brand-title{font-size:15px;font-weight:700;letter-spacing:.03em}
.brand-sub{font-size:10px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:16px}
.badge-stat{font-size:11px;color:var(--t2);padding:3px 10px;background:var(--bg2);border:1px solid var(--bdr);border-radius:20px}

/* FILTERBAR */
#filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 22px;background:var(--bg1);border-bottom:1px solid var(--bdr);flex-shrink:0}
.fg{display:flex;align-items:center;gap:5px}
.fl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.pills{display:flex;gap:3px;flex-wrap:wrap}
.pill{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid var(--bdr2);background:transparent;color:var(--t2);cursor:pointer;transition:all .12s;white-space:nowrap}
.pill:hover{border-color:var(--blue);color:var(--t1)}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.vsep{width:1px;height:18px;background:var(--bdr);flex-shrink:0}
#search-box{background:var(--bg2);border:1px solid var(--bdr);color:var(--t1);border-radius:6px;padding:4px 10px;font-size:12px;width:170px;outline:none;margin-left:auto}
#search-box:focus{border-color:var(--blue)}
#reset-btn{padding:3px 10px;border-radius:6px;font-size:11px;border:1px solid var(--bdr2);background:transparent;color:var(--t3);cursor:pointer}
#reset-btn:hover{border-color:var(--coral);color:var(--coral)}

/* MAIN */
#main{flex:1;overflow-y:auto;padding:14px 22px 22px;display:flex;flex-direction:column;gap:12px}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:13px 15px;position:relative;overflow:hidden;transition:border-color .2s}
.kpi:hover{border-color:var(--bdr2)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac,var(--blue))}
.kpi-lbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:5px}
.kpi-val{font-size:24px;font-weight:800;color:var(--t1);line-height:1;letter-spacing:-.02em}
.kpi-sub{font-size:10px;color:var(--t2);margin-top:4px}

/* GRID ROWS */
.grid2{display:grid;grid-template-columns:1.8fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}

/* CHART CARD */
.cc{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:14px}
.ct{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ct-info{font-size:11px;color:var(--t3);font-weight:400;text-transform:none;letter-spacing:0;margin-left:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--t2)}
.ld{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* STORE BARS */
.sbar-row{margin-bottom:9px}
.sbar-label{display:flex;justify-content:space-between;margin-bottom:3px;font-size:11px}
.sbar-name{color:var(--t2)}
.sbar-val{color:var(--t1);font-weight:700}
.sbar-track{height:5px;background:var(--bg3);border-radius:3px}
.sbar-fill{height:5px;border-radius:3px;transition:width .4s}

/* TABLE */
.tc{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;overflow:hidden}
.th{padding:9px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.tt{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.08em}
.tw{overflow-x:auto;max-height:200px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{position:sticky;top:0;background:var(--bg3);color:var(--t3);font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:7px 10px;text-align:left;border-bottom:1px solid var(--bdr);cursor:pointer;white-space:nowrap;user-select:none}
thead th:hover{color:var(--t1)}
thead th.s{color:var(--blue)}
td{padding:6px 10px;border-bottom:1px solid rgba(35,45,72,.6);white-space:nowrap}
tr:hover td{background:rgba(74,143,255,.05)}
.b{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.b-bl{background:rgba(74,143,255,.14);color:#7EB3FF}
.b-pu{background:rgba(155,122,250,.14);color:#C4B5FD}
.b-te{background:rgba(41,204,180,.12);color:#5EE7D4}
.b-am{background:rgba(245,166,35,.12);color:#FCD34D}
.b-co{background:rgba(247,108,138,.12);color:#FDA4AF}
.b-gr{background:rgba(51,212,138,.12);color:#6EE7B7}
.b-gy{background:rgba(123,141,184,.12);color:#A3B4D4}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}

.card-hover:hover{transform:translateY(-2px);transition:.2s}
.cc,.tc,.kpi{box-shadow:0 8px 20px rgba(0,0,0,.18)}

</style>
</head>
<body>

<div id="topbar">
  <div class="brand">
    <div class="pulse"></div>
    <div>
      <div class="brand-title">Consumibles &amp; Suministros</div>
      <div class="brand-sub">Dashboard de Movimientos · Ene 2025 – May 2026</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="badge-stat" id="badge-recs">— registros</span>
    <span class="badge-stat" id="badge-total">— unidades</span>
  </div>
</div>

<div id="filterbar">
  <div class="fg"><span class="fl">Canal</span><div class="pills" id="fp-canal"></div></div>
  <div class="vsep"></div>
  <div class="fg"><span class="fl">Tienda</span><div class="pills" id="fp-store"></div></div>
  <div class="vsep"></div>
  <div class="fg"><span class="fl">Categoría</span><div class="pills" id="fp-cat"></div></div>
  
  <div class="vsep"></div>
  <div class="fg">
    <span class="fl">Productos</span>
    <select id="product-filter" style="background:var(--bg2);border:1px solid var(--bdr);color:var(--t1);border-radius:6px;padding:4px 8px;font-size:12px;">
      <option value="ALL">Todos los productos</option>
    </select>
  </div>

  <input type="text" id="search-box" placeholder="🔍  Buscar producto...">
  <button id="reset-btn">↺ Reset</button>
</div>

<div id="main">
  <div class="kpi-row" id="kpi-row"></div>

  <div class="grid2">
    <div class="cc">
      <div class="ct">Tendencia mensual <span class="ct-info" id="ti-trend"></span></div>
      <div class="legend" id="leg-trend"></div>
      <div style="position:relative;height:175px"><canvas id="ch-trend" role="img" aria-label="Tendencia mensual de consumibles por canal"></canvas></div>
    </div>
    <div class="cc">
      <div class="ct">Por categoría <span class="ct-info" id="ti-cat"></span></div>
      <div style="position:relative;height:160px"><canvas id="ch-cat" role="img" aria-label="Distribución por categoría"></canvas></div>
      <div class="legend" id="leg-cat" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="grid3">
    <div class="cc">
      <div class="ct">Por tienda</div>
      <div id="store-wrap"></div>
    </div>
    <div class="cc">
      <div class="ct">Todos los artículos <span class="ct-info" id="ti-prod"></span></div>
      <div style="position:relative;height:520px;overflow-y:auto;border-radius:8px;padding-right:4px"><canvas id="ch-prod" role="img" aria-label="Listado completo de artículos por volumen"></canvas></div>
    </div>
  </div>

  <div class="tc">
    <div class="th">
      <span class="tt">Detalle por artículo</span>
      <span id="tbl-count" style="font-size:10px;color:var(--t3)"></span>
    </div>
    <div class="tw">
      <table>
        <thead>
          <tr>
            <th data-c="prod" class="s">Artículo ↕</th>
            <th data-c="cat">Categoría</th>
            <th data-c="store">Tienda</th>
            <th data-c="canal">Canal</th>
            <th data-c="qty" style="text-align:right">Total ↕</th>
            <th data-c="meses" style="text-align:right">Meses</th>
            <th data-c="prom" style="text-align:right">Prom/Mes</th>
          </tr>
        </thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>
  </div>
</div>

const CAT_BADGE   = ['b-gy','b-te','b-bl','b-am','b-pu','b-gr'];

let sCanals = new Set([0,1]);
let sStores = new Set(STORES.map((_,i)=>i));
let sCats   = new Set(CATS.map((_,i)=>i));
let sQ = '';
let sortCol='qty', sortDir=-1;
let cTrend=null, cCat=null, cProd=null;

const fmt = n => Math.round(n).toLocaleString('es');

function fil(){
  return RECS.filter(r=>sCanals.has(r[0])&&sStores.has(r[1])&&sCats.has(r[2])&&
    (sQ===''||PRODS[r[3]].toLowerCase().includes(sQ)));
}

function pill(text, on, cls, onclick){
  const b=document.createElement('button');
  b.className='pill'+(on?' on':'');
  if(cls && on) b.classList.add(cls);
  b.textContent=text;
  b.onclick=onclick;
  return b;
}

function buildFilters(){
  const fc=document.getElementById('fp-canal');
  CANALS.forEach((c,i)=>{
    const p=pill(c, sCanals.has(i), i===1?'pu':null, ()=>{
      sCanals.has(i)?sCanals.delete(i):sCanals.add(i);
      p.className='pill'+(sCanals.has(i)?' on':'');
      render();
    });
    fc.appendChild(p);
  });

  const fs=document.getElementById('fp-store');
  STORES.forEach((s,i)=>{
    const label=s.replace('CERRO VERDE','C.Verde').replace('SAMBIL CHAC','Samb.Ch').replace('SAMBIL VAL','Samb.Val').replace('PLAZA','G.Plaza');
    const p=pill(label, sStores.has(i), null, ()=>{
      sStores.has(i)?sStores.delete(i):sStores.add(i);
      p.className='pill'+(sStores.has(i)?' on':'');
      render();
    });
    fs.appendChild(p);
  });

  const fp=document.getElementById('fp-cat');
  CATS.forEach((c,i)=>{
    const label=c.replace('Artículos de ','').replace('Artículos ','').replace('Consumibles de Venta','Consumibles').replace('Útiles de Oficina','Oficina');
    const p=pill(label, sCats.has(i), null, ()=>{
      sCats.has(i)?sCats.delete(i):sCats.add(i);
      p.className='pill'+(sCats.has(i)?' on':'');
      render();
    });
    fp.appendChild(p);
  });

  document.getElementById('search-box').oninput=e=>{sQ=e.target.value.toLowerCase();render();};
  document.getElementById('reset-btn').onclick=()=>{
    sCanals=new Set([0,1]);sStores=new Set(STORES.map((_,i)=>i));
    sCats=new Set(CATS.map((_,i)=>i));sQ='';
    document.getElementById('search-box').value='';
    document.querySelectorAll('.pill').forEach(p=>{p.className='pill on';});
    render();
  };

  document.querySelectorAll('thead th[data-c]').forEach(th=>{
    th.onclick=()=>{
      if(sortCol===th.dataset.c) sortDir*=-1; else {sortCol=th.dataset.c;sortDir=-1;}
      document.querySelectorAll('thead th').forEach(t=>t.classList.remove('s'));
      th.classList.add('s');
      renderTable(fil());
    };
  });
}

function renderKPIs(recs){
  const tot=recs.reduce((s,r)=>s+r[5],0);
  const tnd=recs.filter(r=>r[0]===0).reduce((s,r)=>s+r[5],0);
  const tal=recs.filter(r=>r[0]===1).reduce((s,r)=>s+r[5],0);
  const np=new Set(recs.map(r=>r[3])).size;
  const ns=new Set(recs.filter(r=>r[0]===0).map(r=>r[1])).size;

  document.getElementById('badge-recs').textContent=fmt(recs.length)+' registros';
  document.getElementById('badge-total').textContent=fmt(tot)+' unidades';

  const items=[
    {l:'Total Unidades',v:fmt(tot),s:'Ambos canales',ac:'var(--blue)'},
    {l:'Tiendas',v:fmt(tnd),s:Math.round(tnd/(tot||1)*100)+'% del total',ac:'var(--blue)'},
    {l:'Taller Interno',v:fmt(tal),s:Math.round(tal/(tot||1)*100)+'% del total',ac:'var(--purple)'},
    {l:'Artículos',v:np,s:'tipos distintos',ac:'var(--teal)'},
    {l:'Tiendas Activas',v:ns,s:'ubicaciones',ac:'var(--amber)'},
  ];
  document.getElementById('kpi-row').innerHTML=items.map(d=>`
    <div class="kpi" style="--ac:${d.ac}">
      <div class="kpi-lbl">${d.l}</div>
      <div class="kpi-val">${d.v}</div>
      <div class="kpi-sub">${d.s}</div>
    </div>`).join('');
}

function renderTrend(recs){
  const byM={};
  MONTHS.forEach(m=>{byM[m]={0:0,1:0};});
  recs.forEach(r=>{if(byM[MONTHS[r[4]]])byM[MONTHS[r[4]]][r[0]]+=r[5];});
  const tot=recs.reduce((s,r)=>s+r[5],0);
  document.getElementById('ti-trend').textContent='Total: '+fmt(tot)+' un.';
  document.getElementById('leg-trend').innerHTML=
    '<div class="li"><span class="ld" style="background:#4A8FFF"></span>Tiendas</div>'+
    '<div class="li"><span class="ld" style="background:#9B7AFA"></span>Taller Interno</div>';

      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'#151E32',borderColor:'#232D48',borderWidth:1,titleColor:'#E4EDFF',bodyColor:'#7B8DB8',
        callbacks:{label:c=>' '+fmt(c.raw)+' un.'}

        y:{ticks:{color:'#3E4D72',font:{size:9},callback:v=>v>=1000?Math.round(v/1000)+'k':v},grid:{color:'rgba(35,45,72,.5)'},border:{color:'#232D48'}}

    }
  });
}

  cCat=new Chart(ctx,{
    type:'doughnut',
    data:{labels:CATS,datasets:[{data:vals,backgroundColor:CAT_COLORS,borderColor:'#0F1525',borderWidth:2,hoverOffset:5}]},
    options:{
      responsive:true,maintainAspectRatio:false,cutout:'62%',
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'#151E32',borderColor:'#232D48',borderWidth:1,titleColor:'#E4EDFF',bodyColor:'#7B8DB8',
        callbacks:{label:c=>' '+fmt(c.raw)+' ('+Math.round(c.raw/(tot||1)*100)+'%)'}
      }}
    }
  });
}

function renderStores(recs){
  const bySt={};STORES.forEach((_,i)=>bySt[i]=0);
  recs.forEach(r=>bySt[r[1]]=(bySt[r[1]]||0)+r[5]);
  const max=Math.max(...Object.values(bySt),1);
  const w=document.getElementById('store-wrap');
  w.innerHTML=STORES.map((s,i)=>{
    const v=bySt[i]||0;
    const pct=Math.round(v/max*100);
    const lbl=s.replace('CERRO VERDE','Cerro Verde').replace('SAMBIL CHAC','Sambil Chacaíto').replace('SAMBIL VAL','Sambil Val').replace('PLAZA','Grand Plaza');
    return `<div class="sbar-row">
      <div class="sbar-label"><span class="sbar-name">${lbl}</span><span class="sbar-val">${fmt(v)}</span></div>
      <div class="sbar-track"><div class="sbar-fill" style="width:${pct}%;background:${STORE_COLORS[i]}"></div></div>
    </div>`;
  }).join('');
}

function renderTopProd(recs){
  const byP={};
  recs.forEach(r=>byP[r[3]]=(byP[r[3]]||0)+r[5]);
  const sorted=Object.entries(byP).sort((a,b)=>b[1]-a[1]).slice(0,14);
  const labels=sorted.map(([i])=>PRODS[i]);
  const vals=sorted.map(([,v])=>v);
  const catMap={};RECS.forEach(r=>catMap[r[3]]=r[2]);
  const colors=sorted.map(([i])=>CAT_COLORS[catMap[i]||0]);

  document.getElementById('ti-prod').textContent='Top '+sorted.length;

  const ctx=document.getElementById('ch-prod').getContext('2d');
  if(cProd)cProd.destroy();
  cProd=new Chart(ctx,{
    type:'bar',
    data:{labels,datasets:[{data:vals,backgroundColor:colors,borderRadius:3}]},
    options:{
      indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'#151E32',borderColor:'#232D48',borderWidth:1,titleColor:'#E4EDFF',bodyColor:'#7B8DB8',
        callbacks:{label:c=>' '+fmt(c.raw)+' unidades'}
      }},
      scales:{
        x:{ticks:{color:'#3E4D72',font:{size:9},callback:v=>v>=1000?Math.round(v/1000)+'k':v},grid:{color:'rgba(35,45,72,.5)'},border:{color:'#232D48'}},
        y:{ticks:{color:'#9BB4E8',font:{size:10}},grid:{display:false},border:{color:'#232D48'}}
      }
    }
  });
}

function renderTable(recs){
  const agg={};
  recs.forEach(r=>{
    const k=`${r[0]}|${r[1]}|${r[2]}|${r[3]}`;
    if(!agg[k])agg[k]={can:r[0],st:r[1],cat:r[2],prod:r[3],qty:0,ms:new Set()};
    agg[k].qty+=r[5];agg[k].ms.add(r[4]);
  });
  let rows=Object.values(agg);
  const colMap={prod:r=>PRODS[r.prod],cat:r=>CATS[r.cat],store:r=>STORES[r.st],canal:r=>CANALS[r.can],qty:r=>r.qty,meses:r=>r.ms.size,prom:r=>r.qty/r.ms.size};
  rows.sort((a,b)=>{const va=colMap[sortCol](a),vb=colMap[sortCol](b);return(typeof va==='string'?va.localeCompare(vb):va-vb)*sortDir;});

  document.getElementById('tbl-count').textContent=rows.length+' artículos';
  document.getElementById('tbl-body').innerHTML=rows.map(r=>`
    <tr>
      <td style="font-weight:600">${PRODS[r.prod]}</td>
      <td><span class="b ${CAT_BADGE[r.cat]}">${CATS[r.cat].replace('Artículos de ','').replace('Artículos ','').replace('Consumibles de Venta','Consumibles').replace('Útiles de Oficina','Oficina')}</span></td>
      <td style="color:var(--t2)">${STORES[r.st]}</td>
      <td><span class="b ${r.can===0?'b-bl':'b-pu'}">${CANALS[r.can]}</span></td>
      <td style="text-align:right;font-weight:700;color:var(--t1)">${fmt(r.qty)}</td>
      <td style="text-align:right;color:var(--t2)">${r.ms.size}</td>
      <td style="text-align:right;color:var(--t3)">${Math.round(r.qty/r.ms.size).toLocaleString('es')}</td>
    </tr>`).join('');
}

function render(){
  const recs=fil();
  renderKPIs(recs);
  renderTrend(recs);
  renderCat(recs);
  renderStores(recs);
  renderTopProd(recs);
  renderTable(recs);
}

buildFilters();
render();

document.addEventListener("DOMContentLoaded",()=>{
  const pf=document.getElementById("product-filter");
  if(pf && typeof PRODS!=="undefined"){
    PRODS.forEach(p=>{
      const op=document.createElement("option");
      op.value=p;
      op.textContent=p;
      pf.appendChild(op);
    });
  }
});

</script>
</body>
</html>
